[build]
  base = "app"
  command = "npm run build"
  publish = "dist"
  # Manual-deploy mode: skip builds from main until the owner requests a production deploy.
  # Exit code 0 = skip the build, 1 = build. Pull-request previews still build.
  ignore = "[ \"$BRANCH\" = \"main\" ]"

[build.environment]
  NODE_VERSION = "22.12.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
