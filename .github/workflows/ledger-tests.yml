name: Ledger browser tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ledger-tests:
    name: Ledger browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: python -m pip install playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Ledger tests
        run: python3 tests/test_ledger.py
      - name: Run owner sign-in browser tests
        run: python3 tests/test_owner_sign_in.py

  app-build:
    name: App typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        run: npm ci --prefix app
      - name: Check types and build app
        env:
          LEDGER_SUPABASE_URL: https://example.supabase.co
          LEDGER_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build --prefix app
